[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ksyun-starflow"
version = "0.1.0"
description = "星流 (MaaS) daily token-usage and cost reports from the KSYUN OpenAPI"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "PyYAML>=6.0",
]

[project.scripts]
ksyun-starflow = "ksyun_starflow.cli:main"

[tool.setuptools.packages.find]
include = ["ksyun_starflow*"]
